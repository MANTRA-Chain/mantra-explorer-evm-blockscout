apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mantra-canary-net-1-applications

resources:
  - resources/host_mapping.yaml
  - resources/pod_disruption_budget.yaml
  - resources/scaled_object.yaml
  - secrets/blockscout-canary-price-updater-secret.yaml
  - secrets/blockscout-canary-postgres-password-secret.yaml
  - secrets/blockscout-canary-secrets.yaml

configMapGenerator:
  - envs:
      - resources/backend-configmap.yaml
    name: blockscout-canary-backend-env-variables
  - envs:
      - resources/frontend-configmap.yaml
    name: blockscout-canary-frontend-env-variables

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

helmCharts:
  #
  # BLOCKSCOUT STACK
  #
  - name: blockscout-stack
    repo: https://blockscout.github.io/helm-charts
    version: 3.4.1
    releaseName: blockscout-stack-canary
    valuesInline:
      config:
        network:
          id: 7888
          name: Mantra Canary
          shortname: MANTRA
          currency:
            name: mantra
            symbol: MANTRA
            decimals: 18
        prometheus:
          enabled: false
      blockscout:
        replicaCount: 1
        image:
          repository: ghcr.io/blockscout/blockscout
          pullPolicy: IfNotPresent
          tag: "9.0.2.commit.2ab549a6"
        separateApi:
          enabled: true
          replicaCount: 2
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
        envFrom:
          - configMapRef:
              name: blockscout-canary-backend-env-variables
          - secretRef:
              name: blockscout-canary-postgres-password-secret
          - secretRef:
              name: blockscout-canary-secrets
        resources:
          requests:
            cpu: 400m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      frontend:
        envFrom:
          - configMapRef:
              name: blockscout-canary-frontend-env-variables
        resources:
          requests:
            cpu: 50m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 1Gi

  ########################################################
  ## POSTGRES
  ########################################################

  - name: postgresql
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.15
    releaseName: blockscout-canary-postgresql
    valuesInline:
      commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"

      global:
        storageClass: "standard-rwo"
        postgresql:
          auth:
            database: blockscout
            username: blockscout
            existingSecret: "blockscout-canary-postgres-password-secret"
            secretKeys:
              adminPasswordKey: "PGPASSWORD"
              userPasswordKey: "PGPASSWORD"
              replicationPasswordKey: "PGPASSWORD"
        security:
          allowInsecureImages: true
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
      architecture: standalone
      primary:
        pdb:
          maxUnavailable: 1
        extendedConfiguration: |
          max_connections = 500
          shared_buffers = 512MB
          effective_cache_size = 1GB
        persistence:
          enabled: true
          size: 20Gi
        persistentVolumeClaimRetentionPolicy:
          retain: true
        resources:
          requests:
            ephemeral-storage: 1Gi
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 1
            memory: 4Gi

  ########################################################
  ## BLOCKSCOUT PRICE UPDATER
  ########################################################

  - name: generic-helm-chart
    repo: https://mantra-chain.github.io/generic-helm-chart
    version: 0.4.9
    releaseName: blockscout-canary-price-updater
    valuesInline:
      nameOverride: blockscout-canary-price-updater
      fullnameOverride: blockscout-canary-price-updater
      service:
        enabled: false
      deployment:
        image:
          repository: ghcr.io/mantra-chain-tech/blockscout-price-updater
          pullPolicy: IfNotPresent
          tag: "b6b3ef7"
        imagePullSecrets:
          - name: ghcr-mantrachaind-registry-read-secret
        annotations:
          argocd.argoproj.io/sync-wave: "2"
        service:
          port:
            - containerPort: 8080
              protocol: TCP
              name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 1
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 1
          successThreshold: 1
        resources:
          requests:
            cpu: "52m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        envFrom:
          - name: blockscout-canary-price-updater-secrets
            type: secret
        env:
          # Price update interval in milliseconds
          UPDATE_INTERVAL_MS: "'900000'"
          HEALTH_CHECK_PORT: "'8080'"
          TOKENS_CONFIG: |
            [
              {
                "contractAddressHash": "0xbff8f85cd6d07012c7369180990a684da3e37bea",
                "coinGeckoId": "tether",
                "symbol": "USDT",
                "name": "Tether USD",
                "iconUrl": "data:image/png;base64,"
              }
            ]