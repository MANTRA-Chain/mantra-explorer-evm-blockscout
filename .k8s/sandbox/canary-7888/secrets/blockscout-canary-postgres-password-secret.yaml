apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: blockscout-canary-postgres-password-secret
spec:
  data:
    - secretKey: "password"
      remoteRef:
        conversionStrategy: Default
        key: blockscout-canary-postgres-password
    - secretKey: "PGPASSWORD"
      remoteRef:
        conversionStrategy: Default
        key: blockscout-canary-postgres-password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secrets-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: blockscout-canary-postgres-password-secret
