apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: blockscout-dryrun-mantrachain-dev
  annotations:
    external-dns.ambassador-service: emissary-ingress.emissary
spec:
  hostname: blockscout.dryrun.mantrachain.dev
  acmeProvider:
    authority: none
  tlsSecret:
    name: asia-east2-std.dryrun.mantrachain.dev-wildcard-tls-secret
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: blockscout-dryrun-mantrachain-dev
spec:
  hostname: "blockscout.dryrun.mantrachain.dev"
  prefix: /
  service: blockscout-stack-dryrun-frontend-svc:80
  precedence: 0
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: api-blockscout.dryrun.mantrachain.dev
spec:
  hostname: "blockscout.dryrun.mantrachain.dev"
  prefix: /api
  rewrite: ""
  service: blockscout-stack-dryrun-blockscout-svc:80
  allow_upgrade:
    - websocket
  precedence: 1
---
# Backend socket (Phoenix websocket)
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: socket-blockscout.dryrun.mantrachain.dev
spec:
  hostname: blockscout.dryrun.mantrachain.dev
  prefix: /socket
  rewrite: /socket
  service: blockscout-stack-dryrun-blockscout-svc:80
  allow_upgrade:
    - websocket
  precedence: 1
---
# (Optional) public metrics
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: metrics-blockscout.dryrun.mantrachain.dev
spec:
  hostname: blockscout.dryrun.mantrachain.dev
  prefix: /public-metrics
  service: blockscout-stack-dryrun-blockscout-svc:80
  precedence: 1