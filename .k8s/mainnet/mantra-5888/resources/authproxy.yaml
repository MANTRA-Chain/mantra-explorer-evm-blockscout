apiVersion: cloudsql.cloud.google.com/v1
kind: AuthProxyWorkload
metadata:
  name: blockscout-stack
spec:
  workloadSelector:
    kind: "Deployment"
    selector:
      matchLabels:
        app: blockscout-stack-blockscout
  instances:
  - connectionString: "mantra-chain-mainnet:asia-east2:mantra-chain-mainnet-asia-east2-evm-blockscout"
    port: 5432
    privateIP: true
    portEnvName: "DB_PORT"
    autoIAMAuthN: true
---
apiVersion: cloudsql.cloud.google.com/v1
