apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mantra-1-applications

resources:
  - resources/host_mapping.yaml
  - resources/pod_disruption_budget.yaml
  - resources/authproxy.yaml
  - resources/hpa.yaml
  - secrets/blockscout-price-updater-secret.yaml

configMapGenerator:
  - envs:
      - resources/backend-configmap.yaml
    name: backend-env-variables
  - envs:
      - resources/frontend-configmap.yaml
    name: frontend-env-variables
  - envs:
      - resources/blockscout-price-updater.yaml
    name: blockscout-price-updater-env-variables


patches:
  - path: resources/migrations-job-patch.yaml
    target:
      kind: Job
      name: blockscout-stack-blockscout-migrations

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

helmCharts:
  #
  # BLOCKSCOUT STACK
  #
  - name: blockscout-stack
    repo: https://blockscout.github.io/helm-charts
    version: 3.4.1
    releaseName: blockscout-stack
    valuesInline:
      config:
        network:
          id: 5888
          name: MANTRA
          shortname: MANTRA
          currency:
            name: mantra
            symbol: MANTRA
            decimals: 18
        prometheus:
          enabled: false
      blockscout:
        replicaCount: 1
        image:
          repository: ghcr.io/blockscout/blockscout
          pullPolicy: IfNotPresent
          tag: "9.0.2.commit.2ab549a6"
        separateApi:
          enabled: true
          replicaCount: 2
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
        envFrom:
          - configMapRef:
              name: backend-env-variables
        resources:
          requests:
            cpu: 400m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      frontend:
        envFrom:
          - configMapRef:
              name: frontend-env-variables
        resources:
          requests:
            cpu: 50m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 1Gi

  ########################################################
  ## BLOCKSCOUT PRICE UPDATER
  ########################################################

  - name: generic-helm-chart
    repo: https://mantra-chain.github.io/generic-helm-chart
    version: 0.4.9
    releaseName: blockscout-price-updater
    valuesInline:
      nameOverride: blockscout-price-updater
      fullnameOverride: blockscout-price-updater
      serviceAccount:
        create: false
        name: blockscout-stack # Use this existing service account defined in terraform
      service:
        enabled: false
      deployment:
        image:
          repository: ghcr.io/mantra-chain-tech/blockscout-price-updater
          pullPolicy: IfNotPresent
          tag: "948bfa7"
        imagePullSecrets:
          - name: ghcr-mantra-chain-applications-registry-read-secret
        service:
          port:
            - containerPort: 8080
              protocol: TCP
              name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 1
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 1
          successThreshold: 1
        resources:
          requests:
            cpu: "52m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        envFrom:
          # - name: blockscout-price-updater-secret
          #   type: secret
          - name: blockscout-price-updater-env-variables
            type: configmap