apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mantra-skynet-1-applications

resources:
  - resources/host_mapping.yaml
  - resources/pod_disruption_budget.yaml
  - resources/authproxy.yaml
  - resources/scaled_object.yaml

configMapGenerator:
  - envs:
      - resources/backend-configmap.yaml
    name: backend-env-variables
  - envs:
      - resources/frontend-configmap.yaml
    name: frontend-env-variables

patches:
  - path: resources/migrations-job-patch.yaml
    target:
      kind: Job
      name: skynet-blockscout-stack-blockscout-migrations

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

helmCharts:
  #
  # BLOCKSCOUT STACK
  #
  - name: blockscout-stack
    repo: https://blockscout.github.io/helm-charts
    version: 3.4.1
    # version: 3.0.0
    releaseName: skynet-blockscout-stack
    valuesInline:
      config:
        network:
          id: 262144
          name: Mantra Skynet
          shortname: Skynet
          currency:
            name: om
            symbol: OM
            decimals: 18
        prometheus:
          enabled: false
      blockscout:
        replicaCount: 1
        image:
          repository: ghcr.io/blockscout/blockscout
          pullPolicy: IfNotPresent
          tag: "9.0.2.commit.2ab549a6"
        separateApi:
          enabled: true
          replicaCount: 2
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
        envFrom:
          - configMapRef:
              name: backend-env-variables
        resources:
          requests:
            cpu: 400m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      frontend:
        envFrom:
          - configMapRef:
              name: frontend-env-variables
        resources:
          requests:
            cpu: 50m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 1Gi
