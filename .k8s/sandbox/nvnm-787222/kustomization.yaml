apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvnm-tempo-devnet-1-applications

resources:
  - resources/host_mapping.yaml
  - resources/pod_disruption_budget.yaml
  - secrets/blockscout-nvnm-postgres-password-secret.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - envs:
      - resources/backend-configmap.yaml
    name: blockscout-nvnm-backend-env-variables
  - envs:
      - resources/frontend-configmap.yaml
    name: blockscout-nvnm-frontend-env-variables

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

helmCharts:
  #
  # BLOCKSCOUT STACK
  #
  - name: blockscout-stack
    repo: https://blockscout.github.io/helm-charts
    version: 3.4.1
    releaseName: blockscout-stack-nvnm
    valuesInline:
      config:
        network:
          id: 787222
          name: NVNM Devnet
          shortname: NVNM
          currency:
            name: NVNMusd
            symbol: NVNMusd
            decimals: 16
        prometheus:
          enabled: false
      blockscout:
        replicaCount: 1
        image:
          repository: ghcr.io/blockscout/blockscout
          pullPolicy: IfNotPresent
          tag: "9.0.2.commit.2ab549a6"
        separateApi:
          enabled: true
          replicaCount: 2
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
        envFrom:
          - configMapRef:
              name: blockscout-nvnm-backend-env-variables
          - secretRef:
              name: blockscout-nvnm-postgres-password-secret
        resources:
          requests:
            cpu: 400m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      frontend:
        envFrom:
          - configMapRef:
              name: blockscout-nvnm-frontend-env-variables
        resources:
          requests:
            cpu: 50m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 1Gi

  ########################################################
  ## POSTGRES
  ########################################################

  - name: postgresql
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.15
    releaseName: blockscout-nvnm-postgresql
    valuesInline:
      commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"

      global:
        storageClass: "standard-rwo"
        postgresql:
          auth:
            database: blockscout
            username: blockscout
            existingSecret: "blockscout-nvnm-postgres-password-secret"
            secretKeys:
              adminPasswordKey: "PGPASSWORD"
              userPasswordKey: "PGPASSWORD"
              replicationPasswordKey: "PGPASSWORD"
        security:
          allowInsecureImages: true
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
      architecture: standalone
      primary:
        pdb:
          maxUnavailable: 1
        extendedConfiguration: |
          max_connections = 500
          shared_buffers = 512MB
          effective_cache_size = 1GB
        persistence:
          enabled: true
          size: 20Gi
        persistentVolumeClaimRetentionPolicy:
          retain: true
        resources:
          requests:
            ephemeral-storage: 1Gi
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1
            memory: 4Gi
