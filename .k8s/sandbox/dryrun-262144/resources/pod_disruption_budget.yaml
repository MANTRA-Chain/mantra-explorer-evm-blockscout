apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blockscout-stack-dryrun-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: blockscout-stack-dryrun-blockscout
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blockscout-stack-dryrun-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: blockscout-stack-dryrun-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blockscout-stack-dryrun-blockscout-indexer
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: blockscout-stack-dryrun-blockscout-indexer
