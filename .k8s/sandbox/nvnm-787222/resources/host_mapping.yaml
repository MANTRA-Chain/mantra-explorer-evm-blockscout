apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: blockscout-nvnm-mantrachain-dev
  annotations:
    external-dns.ambassador-service: emissary-ingress.emissary
spec:
  hostname: blockscout.nvnm.canary.mantrachain.dev
  acmeProvider:
    authority: none
  tlsSecret:
    name: asia-east2-std.canary.mantrachain.dev-wildcard-tls-secret
    # Referenced cross-namespace (same pattern as nvnm-tempo-devnet-1's RPC
    # Host resources) so this app namespace needs no reflector allow-list change.
    namespace: emissary
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: blockscout-nvnm-mantrachain-dev
spec:
  hostname: "blockscout.nvnm.canary.mantrachain.dev"
  prefix: /
  service: blockscout-stack-nvnm-frontend-svc:80
  precedence: 0
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: api-blockscout.nvnm.canary.mantrachain.dev
spec:
  hostname: "blockscout.nvnm.canary.mantrachain.dev"
  prefix: /api
  rewrite: ""
  service: blockscout-stack-nvnm-blockscout-svc:80
  allow_upgrade:
    - websocket
  precedence: 1
---
# Backend socket (Phoenix websocket)
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: socket-blockscout.nvnm.canary.mantrachain.dev
spec:
  hostname: blockscout.nvnm.canary.mantrachain.dev
  prefix: /socket
  rewrite: /socket
  service: blockscout-stack-nvnm-blockscout-svc:80
  allow_upgrade:
    - websocket
  precedence: 1
---
# (Optional) public metrics
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: metrics-blockscout.nvnm.canary.mantrachain.dev
spec:
  hostname: blockscout.nvnm.canary.mantrachain.dev
  prefix: /public-metrics
  service: blockscout-stack-nvnm-blockscout-svc:80
  precedence: 1
