apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mantra-canary-net-1-applications

resources:
  - resources/host_mapping.yaml
  - resources/pod_disruption_budget.yaml
  - secrets/blockscout-canary-postgres-password-secret.yaml

configMapGenerator:
  - envs:
      - resources/backend-configmap.yaml
    name: blockscout-canary-backend-env-variables
  - envs:
      - resources/frontend-configmap.yaml
    name: blockscout-canary-frontend-env-variables

# enable logging in logs explorer
labels:
  - pairs:
      gke.logging.enabled: "true"
    includeSelectors: false
    includeTemplates: true

helmCharts:
  #
  # BLOCKSCOUT STACK
  #
  - name: blockscout-stack
    repo: https://blockscout.github.io/helm-charts
    version: 3.4.1
    releaseName: blockscout-stack-canary
    valuesInline:
      config:
        network:
          id: 7888
          name: Mantra Canary
          shortname: OM
          currency:
            name: om
            symbol: OM
            decimals: 18
        prometheus:
          enabled: false
      blockscout:
        replicaCount: 1
        envFrom:
          - configMapRef:
              name: blockscout-canary-backend-env-variables
          - secretRef:
              name: blockscout-canary-postgres-password-secret
        resources:
          requests:
            cpu: 400m
            memory: 500Mi
          limits:
            cpu: 1
            memory: 1Gi
      frontend:
        envFrom:
          - configMapRef:
              name: blockscout-canary-frontend-env-variables
        resources:
          requests:
            cpu: 50m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 1Gi

  ########################################################
  ## POSTGRES
  ########################################################

  - name: postgresql
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 16.7.15
    releaseName: blockscout-canary-postgresql
    valuesInline:
      commonAnnotations:
        argocd.argoproj.io/sync-wave: "-1"

      global:
        storageClass: "standard-rwo"
        postgresql:
          auth:
            database: blockscout
            username: blockscout
            existingSecret: "blockscout-canary-postgres-password-secret"
            secretKeys:
              adminPasswordKey: "PGPASSWORD"
              userPasswordKey: "PGPASSWORD"
              replicationPasswordKey: "PGPASSWORD"
        security:
          allowInsecureImages: true
      image:
        registry: docker.io
        repository: bitnamilegacy/postgresql
      architecture: replication
      replication:
        synchronousCommit: "remote_apply"
        numSynchronousReplicas: 1
      primary:
        pdb:
          maxUnavailable: 1
        extendedConfiguration: |
          max_connections = 300
        persistence:
          enabled: true
          size: 20Gi
        persistentVolumeClaimRetentionPolicy:
          retain: true
        resources:
          requests:
            ephemeral-storage: 1Gi
            cpu: 256m
            memory: 500Mi
          limits:
            cpu: 512m
            memory: 1Gi
      readReplicas:
        resources:
          requests:
            ephemeral-storage: 1Gi
            cpu: 256m
            memory: 500Mi
          limits:
            cpu: 512m
            memory: 1Gi
        pdb:
          maxUnavailable: 1
        persistence:
          enabled: true
          size: 20Gi
        persistentVolumeClaimRetentionPolicy:
          enabled: true